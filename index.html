<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Vibe Video</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>Vibe</h1>
    <input id="search" type="search" placeholder="Search videos…" autocomplete="off">
  </header>

  <main id="feed" class="feed"></main>

  <nav class="bottombar">
    <button class="active" data-tab="home">Home</button>
    <button data-tab="saved">Saved</button>
    <button data-tab="add">+ Add</button>
  </nav>

  <dialog id="addDialog">
    <form id="addForm" method="dialog">
      <h2>Video add karo</h2>
      <label>Title<input name="title" required maxlength="80"></label>
      <label>Creator<input name="author" maxlength="40" placeholder="@yourname"></label>
      <label>Video URL (mp4 ya YouTube link)<input name="url" type="url" required placeholder="https://..."></label>
      <menu>
        <button type="button" id="cancelBtn" class="ghost">Cancel</button>
        <button type="submit" class="primary">Add</button>
      </menu>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
